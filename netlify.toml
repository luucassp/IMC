# Deploy do front-end (Vite/React) no Netlify.
# Defina a variável VITE_API_URL no painel do Netlify apontando para a URL
# pública do backend (ex.: https://imc-treino-api.onrender.com).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: todas as rotas caem no index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
